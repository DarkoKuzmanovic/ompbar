[project]
name = "ompbar"
version = "0.1.0"
description = "A native KDE Plasma quick-question bar for the omp coding agent."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
